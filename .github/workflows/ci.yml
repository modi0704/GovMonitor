name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # The app's minimum supported PostgreSQL (MASTERPLAN 5.2). Compose ships 18.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/govmonitor
      DATABASE_ADMIN_URL: postgres://app_owner:app_owner@localhost:5432/govmonitor
    steps:
      - uses: actions/checkout@v4

      - name: Create database roles (app_owner, app_user)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          APP_OWNER_PASSWORD: app_owner
          APP_USER_PASSWORD: app_user
        run: deploy/db/init-roles.sh

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make install

      - name: make check
        run: make check

  smoke:
    # P12.7: the five user flows (desktop and phone) and the accessibility checks in a browser,
    # against a freshly migrated and seeded database with the web server and a worker running.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/govmonitor
      DATABASE_ADMIN_URL: postgres://app_owner:app_owner@localhost:5432/govmonitor
      DJANGO_SETTINGS_MODULE: config.settings.dev
      SMOKE_BASE_URL: http://127.0.0.1:8000
      PLATFORM_EMAIL: ops@govmonitor.test
      PLATFORM_PASSWORD: platform-smoke-pass-2026
    steps:
      - uses: actions/checkout@v4
      - name: Create database roles (app_owner, app_user)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          APP_OWNER_PASSWORD: app_owner
          APP_USER_PASSWORD: app_user
        run: deploy/db/init-roles.sh
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies and the browser
        run: |
          make install
          cd frontend && npx playwright install --with-deps chromium
      - name: Database, demo data, platform owner, frontend build
        run: |
          make migrate-local seed-demo-local build-frontend
          cd backend && .venv/bin/python manage.py create_platform_admin --email "$PLATFORM_EMAIL" --password "$PLATFORM_PASSWORD"
      - name: Start the web server and a worker
        run: |
          cd backend
          nohup .venv/bin/python manage.py runserver 127.0.0.1:8000 --noreload > ../web.log 2>&1 &
          nohup .venv/bin/python manage.py run_worker > ../worker.log 2>&1 &
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8000/api/v1/health && break; sleep 2; done
      - name: Smoke tests
        run: make smoke
      - name: Logs on failure
        if: failure()
        run: tail -n 100 web.log worker.log

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image and start the stack
        run: make up
      - name: Health (direct, and through Caddy over HTTPS)
        run: |
          curl -fsS http://localhost:8000/api/v1/health
          for i in $(seq 1 30); do curl -fsSk https://localhost/api/v1/health && break; sleep 2; done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "308"
      - name: Cloud compose against stand-in managed PostgreSQL and S3
        run: deploy/test-cloud-compose.sh
      - name: Backup, wipe, restore (results and files identical)
        run: deploy/test-backup-restore.sh
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 100
      - name: Stop
        if: always()
        run: make down
