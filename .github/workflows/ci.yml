name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        # The app's minimum supported PostgreSQL (MASTERPLAN 5.2). Compose ships 18.
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://app_user:app_user@localhost:5432/govmonitor
      DATABASE_ADMIN_URL: postgres://app_owner:app_owner@localhost:5432/govmonitor
    steps:
      - uses: actions/checkout@v4

      - name: Create database roles (app_owner, app_user)
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
          APP_OWNER_PASSWORD: app_owner
          APP_USER_PASSWORD: app_user
        run: deploy/db/init-roles.sh

      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: make install

      - name: make check
        run: make check

  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: check
    steps:
      - uses: actions/checkout@v4
      - name: Build image and start the stack
        run: make up
      - name: Health
        run: curl -fsS http://localhost:8000/api/v1/health
      - name: Logs on failure
        if: failure()
        run: docker compose -f deploy/docker-compose.yml logs --tail 100
      - name: Stop
        if: always()
        run: make down
