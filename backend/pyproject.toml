[project]
name = "govmonitor-backend"
version = "0.1.0"
requires-python = ">=3.13,<3.14"

[tool.ruff]
line-length = 110
target-version = "py313"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S", "C4", "SIM"]
ignore = ["S101", "S608", "DJ001", "DJ008", "DJ012"]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S105", "S106", "S311", "SIM117"]
"conftest.py" = ["S105", "S106"]
"tests/*.py" = ["S105", "S106", "S311", "SIM117"]
"config/settings/*.py" = ["S105"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q --strict-markers"
markers = ["perf: timing tests; run without coverage tracing (make test-backend runs them separately)"]
testpaths = ["apps", "tests"]
