# Cloud service (D13, P13.2): web and worker only. PostgreSQL is a managed database and files live
# in S3-compatible storage; TLS ends at the cloud load balancer in front of the web port.
#   cp deploy/cloud.env.example deploy/cloud.env   # fill in the database, bucket and secrets
#   docker compose -f deploy/docker-compose.cloud.yml --env-file deploy/cloud.env up -d
# The database roles app_owner / app_user are created once with deploy/db/init-roles.sh (see
# docs/ADMIN_GUIDE.md); migrations run as app_owner when the web container starts.
name: govmonitor-cloud

x-app-env: &app-env
  DEPLOYMENT_MODE: ${DEPLOYMENT_MODE:-multi}
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY}
  LOGIN_DISABLED: ${LOGIN_DISABLED:-0}  # a cloud service always asks for sign-in
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:?set ALLOWED_HOSTS}
  CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:?set CSRF_TRUSTED_ORIGINS}
  DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL (app_user)}
  DATABASE_ADMIN_URL: ${DATABASE_ADMIN_URL:?set DATABASE_ADMIN_URL (app_owner)}
  FILE_STORAGE: s3
  S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
  S3_BUCKET: ${S3_BUCKET:?set S3_BUCKET}
  S3_ACCESS_KEY: ${S3_ACCESS_KEY:?set S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY:?set S3_SECRET_KEY}
  EMAIL_URL: ${EMAIL_URL:-}
  PUBLIC_URL: ${PUBLIC_URL:-}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
  MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-25}
  SECURE_SSL: ${SECURE_SSL:-1}
  TRUST_X_FORWARDED_FOR: ${TRUST_X_FORWARDED_FOR:-1}
  LOG_FORMAT: ${LOG_FORMAT:-json}
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}

services:
  web:
    image: ${GOVMONITOR_IMAGE:-govmonitor}:${GOVMONITOR_VERSION:-dev}
    command: ["web"]
    environment: *app-env
    ports:
      - "${WEB_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/v1/health', timeout=3).status==200 else 1)\""]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  worker:
    image: ${GOVMONITOR_IMAGE:-govmonitor}:${GOVMONITOR_VERSION:-dev}
    command: ["worker"]
    environment:
      <<: *app-env
      MIGRATE_ON_START: "0"
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped
